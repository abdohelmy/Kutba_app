[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khutba-api"
version = "0.1.0"
description = "Grounded, human-reviewed khutba translation API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.41,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.7,<7",
  "python-docx>=1.2,<2",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2.1,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "openai>=1.97,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
